services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_pass
      POSTGRES_DB: blog_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://blog_user:blog_pass@postgres:5432/blog_db
      JWT_SECRET: change-this-to-a-random-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: 7
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE: "5242880"
      CORS_ORIGINS: http://localhost:5173
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
